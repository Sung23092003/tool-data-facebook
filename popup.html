<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Scraper</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            width: 350px;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
        }

        input, textarea {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        #exportBtn {
            background: #10b981;
        }

        #exportBtn:hover {
            background: #059669;
        }

        .status {
            background: var(--glass);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            min-height: 40px;
            border: 1px solid var(--border);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
        }

        .loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .running .loader {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>FB Data Scraper</h1>
        
        <div class="input-group">
            <label for="serviceName">Tên dịch vụ</label>
            <input type="text" id="serviceName" placeholder="Ví dụ: Trung tâm tiếng anh">
        </div>

        <div class="input-group">
            <label for="keywords">Từ cần chứa (phân cách bằng dấu phẩy)</label>
            <textarea id="keywords" placeholder="Ví dụ: Trung, Anh, Ngôn Ngữ"></textarea>
        </div>

        <div class="btn-container">
            <button id="startBtn">Bắt đầu quét</button>
            <button id="exportBtn" disabled>Xuất Excel</button>
        </div>

        <div class="status" id="status">
            Sẵn sàng...
        </div>

        <div class="stats">
            <span id="progressText">Tổng: 0 items</span>
            <span id="filteredText">Lọc: 0 items</span>
        </div>
    </div>

    <script src="libs/xlsx.full.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
